apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kafka-ui.fullname" . }}
  labels:
    {{- include "kafka-ui.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kafka-ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "kafka-ui.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kafka-ui.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: kafka-ui
          image: {{ include "kafka-ui.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "kafka-ui.fullname" . }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or (eq .Values.mode "oidc") .Values.extraEnv }}
          env:
            {{- if eq .Values.mode "oidc" }}
            {{- with .Values.oidc.clientSecret }}
            {{- if .existingSecret }}
            - name: QUARKUS_OIDC_CREDENTIALS_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret | quote }}
                  key: {{ .key | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.oidc.stateSecret }}
            {{- if .existingSecret }}
            - name: QUARKUS_OIDC_AUTHENTICATION_STATE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret | quote }}
                  key: {{ .key | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- /* whole-directory mounts, no file-level overrides: cert reload relies on the symlink swap */}}
            - name: ca-bundle
              mountPath: /etc/kafka-ui/ca
              readOnly: true
            {{- if include "kafka-ui.isMtls" . }}
            - name: client-cert
              mountPath: /etc/kafka-ui/client
              readOnly: true
            {{- end }}
            {{- if .Values.containerSecurityContext.readOnlyRootFilesystem }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
      volumes:
        - name: ca-bundle
          secret:
            secretName: {{ .Values.tls.ca.existingSecret | quote }}
            items:
              - key: {{ .Values.tls.ca.key | quote }}
                path: ca.pem
        {{- if include "kafka-ui.isMtls" . }}
        - name: client-cert
          secret:
            secretName: {{ include "kafka-ui.clientSecretName" . | quote }}
            items:
              {{- if .Values.certManager.enabled }}
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
              {{- else }}
              - key: {{ .Values.tls.client.certKey | quote }}
                path: tls.crt
              - key: {{ .Values.tls.client.keyKey | quote }}
                path: tls.key
              {{- end }}
        {{- end }}
        {{- if .Values.containerSecurityContext.readOnlyRootFilesystem }}
        - name: tmp
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
