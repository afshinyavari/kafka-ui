# Test environments only: mTLS with the client certificate issued by cert-manager.
mode: mtls
image:
  repository: image-registry.openshift-image-registry.svc:5000/kafka-ui/kafka-ui
kafka:
  bootstrapServers: my-cluster-kafka-bootstrap.kafka.svc:9093
registry:
  url: https://apicurio-proxy.kafka.svc/apis/registry/v3
tls:
  ca:
    existingSecret: ca-bundle
certManager:
  enabled: true
  issuerRef:
    name: kafka-clients-ca
    kind: ClusterIssuer
  commonName: kafka-ui
  dnsNames:
    - kafka-ui.example.com
