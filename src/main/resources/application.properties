# Mode: mtls | oidc (env KAFKA_UI_MODE). Derived auth settings: see ModeConfigSource.
kafka-ui.mode=oidc

# Kafka / TLS / registry (certificates are PEM files, key is PKCS#8)
%dev.kafka-ui.bootstrap-servers=localhost:9092
%dev.kafka-ui.tls.ca-file=.certs/ca.crt
%dev.kafka-ui.registry.url=http://localhost:8081/apis/registry/v3

# OIDC (web-app, authorization code flow)
quarkus.oidc.application-type=web-app
quarkus.oidc.token.refresh-expired=true
quarkus.oidc.token.refresh-token-time-skew=1M
quarkus.oidc.authentication.pkce-required=true
quarkus.oidc.authentication.cookie-same-site=strict

# Always public
quarkus.http.auth.permission.static.paths=/vendor/*,/css/*,/q/health/*
quarkus.http.auth.permission.static.policy=permit

quarkus.qute.suffixes=html
