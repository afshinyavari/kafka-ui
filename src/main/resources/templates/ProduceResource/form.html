<div class="modal-backdrop" id="produce-modal">
  <div class="modal" role="dialog" aria-labelledby="produce-title">
    <form hx-post="/topics/{name}/produce" hx-target="#produce-result" hx-swap="innerHTML">
      <div class="modal-head">
        <h2 id="produce-title" class="modal-title">Produce message to {name}</h2>
        <button type="button" class="btn btn-ghost btn-sm" aria-label="Close" onclick="document.getElementById('produce-modal').remove()">{#include icons/close /}</button>
      </div>
      <div class="modal-body">
        <label class="field max-w-48"><span>Partition<span class="field-hint">optional</span></span>
          <input type="number" name="partition" min="0" placeholder="auto" class="input">
        </label>
        {#include ProduceResource/part role='key' label='Key' /}
        {#include ProduceResource/part role='value' label='Value' /}
        <fieldset class="fieldset">
          <legend>Headers</legend>
          <template id="produce-header-row">
            <div class="header-row grid grid-cols-[minmax(0,1fr)_minmax(0,1fr)_auto] gap-2">
              <input type="text" name="headerName" placeholder="name" aria-label="Header name" class="input font-mono">
              <input type="text" name="headerValue" placeholder="value" aria-label="Header value" class="input font-mono">
              <button type="button" class="btn btn-ghost" aria-label="Remove header" title="Remove header" onclick="this.closest('.header-row').remove()">{#include icons/close /}</button>
            </div>
          </template>
          <div id="produce-headers" class="space-y-2 empty:hidden"></div>
          <button type="button" class="btn btn-sm mt-3 [#produce-headers:empty+&]:mt-0"
                  onclick="document.getElementById('produce-headers').appendChild(document.getElementById('produce-header-row').content.cloneNode(true))">{#include icons/plus /}Add header</button>
        </fieldset>
        <div id="produce-result"></div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn" onclick="document.getElementById('produce-modal').remove()">Close</button>
        <button type="submit" class="btn btn-primary">{#include icons/send /}Produce</button>
      </div>
    </form>
  </div>
</div>
