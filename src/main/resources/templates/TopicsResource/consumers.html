<table>
  <thead><tr><th>Group id</th><th>State</th><th>Members</th><th>Lag</th></tr></thead>
  <tbody>
  {#for g in groups}
    <tr>
      <td><a href="/consumers/{g.groupId}">{g.groupId}</a></td>
      <td><span class="badge">{g.state}</span></td>
      <td>{g.members}</td>
      <td>{g.totalLag}</td>
    </tr>
  {#else}
    <tr><td colspan="4" class="muted">No consumer groups have committed offsets on this topic.</td></tr>
  {/for}
  </tbody>
</table>
