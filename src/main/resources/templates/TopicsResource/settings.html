{#if info.settingsDenied}
<div class="alert alert-warn" role="alert">{#include icons/warning /}<p>{info.settingsDenied}</p></div>
{#else}
<div class="table-wrap">
<table class="tbl [&_td:nth-child(2)]:break-all" data-mono="1 2">
  <thead><tr><th>Key</th><th>Value</th><th>Source</th></tr></thead>
  <tbody>
  {#for c in info.configs.values}
    <tr>
      <td>{c.name}</td>
      <td>{c.value}</td>
      <td>{#if c.overridden}<span class="badge badge-accent">overridden</span>{#else}<span class="badge">default</span>{/if}</td>
    </tr>
  {/for}
  </tbody>
</table>
</div>
{/if}
