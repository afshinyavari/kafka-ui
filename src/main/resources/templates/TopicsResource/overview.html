<div class="table-wrap">
<table class="tbl" data-num="1 2 3 4 5 6 7">
  <thead><tr><th>Partition</th><th>Leader</th><th>Replicas</th><th>In sync</th><th>First offset</th><th>Last offset</th><th>Messages</th></tr></thead>
  <tbody>
  {#for p in info.partitions}
    <tr>
      <td>{p.partition}</td>
      <td>{p.leader}</td>
      <td>{p.replicas.size}</td>
      <td>{p.isr.size}</td>
      <td>{p.startOffset ?: "–"}</td>
      <td>{p.endOffset ?: "–"}</td>
      <td>{p.messages ?: "–"}</td>
    </tr>
  {/for}
  </tbody>
</table>
</div>
