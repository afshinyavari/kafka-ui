<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{#insert title}Kafka UI{/}</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/vendor/github.min.css">
  <script src="/vendor/htmx.min.js"></script>
  <script src="/vendor/htmx-ext-sse.js"></script>
  <script src="/vendor/highlight.min.js"></script>
</head>
<body hx-ext="sse">
{#if bannerText}
  <div class="banner">{bannerText}</div>
{/if}
<div class="shell">
  <aside class="sidebar">
    <div class="brand">Kafka UI</div>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/brokers">Brokers</a>
      <a href="/topics">Topics</a>
      <a href="/consumers">Consumers</a>
      <a href="/schemas">Schema Registry</a>
      <a href="/acls">ACLs</a>
    </nav>
    {#if username}
    <div class="user">{username}</div>
    {/if}
  </aside>
  <main class="content">
    {#insert content}{/}
  </main>
</div>
</body>
</html>
