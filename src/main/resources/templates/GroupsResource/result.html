<div class="alert alert-success" role="status">
  {#include icons/check /}
  <div class="min-w-0">
    <p>Offsets of group {groupId} were reset:</p>
    <table class="tbl" data-num="3">
      <thead><tr><th>Topic</th><th>Partition</th><th>New offset</th></tr></thead>
      <tbody>
      {#for l in lines}
        <tr><td>{l.topic}</td><td>{l.partition}</td><td>{l.offset}</td></tr>
      {/for}
      </tbody>
    </table>
  </div>
</div>
