<input type="hidden" name="group" value="{group}">
<input type="hidden" name="artifact" value="{artifact}">
<label class="field">Version of {artifact}
  <select name="version" class="input" hx-post="/schemas/{group.urlEnc}/{artifact.urlEnc}/template" hx-trigger="load, change"
          hx-include="closest form" hx-target="#produce-value" hx-swap="outerHTML">
    {#for v in versions}
    <option value="{v.version}">{v.version}</option>
    {/for}
  </select>
</label>
