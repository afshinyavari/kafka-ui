{@java.lang.String name}
{@se.afshin.yavari.kafka.ui.messages.SearchForm form}
{@java.lang.String error}
{@int maxRows}
{#if error}
<div class="alert alert-error" role="alert">{#include icons/alert /}<p>{error}</p></div>
{#else}
<div id="search-stream" class="search-status" sse-connect="/topics/{name}/messages/tail?{form.tailQuery}" sse-close="done">
  <span sse-swap="progress">Connecting…</span>
  {|<button type="button" class="btn" onclick="htmx.swap('#search-stream', document.getElementById('tail-paused').innerHTML, {swapStyle: 'outerHTML'})">Pause</button>|}
  <div hidden sse-swap="match" hx-target="#tail-rows" hx-swap="afterbegin"></div>
  <div hidden sse-swap="done" hx-target="#search-stream" hx-swap="outerHTML"></div>
  <div hidden sse-swap="expired"></div>
</div>
<template id="tail-paused"><div id="search-stream" class="search-status">Paused
  {|<button type="button" class="btn" onclick="htmx.swap('#search-stream', document.getElementById('tail-live').innerHTML, {swapStyle: 'outerHTML'})">Resume</button>|}
</div></template>
<template id="tail-live"><div id="search-stream" class="search-status" sse-connect="/topics/{name}/messages/tail?{form.tailQuery}" sse-close="done">
  <span sse-swap="progress">Reconnecting…</span>
  {|<button type="button" class="btn" onclick="htmx.swap('#search-stream', document.getElementById('tail-paused').innerHTML, {swapStyle: 'outerHTML'})">Pause</button>|}
  <div hidden sse-swap="match" hx-target="#tail-rows" hx-swap="afterbegin"></div>
  <div hidden sse-swap="done" hx-target="#search-stream" hx-swap="outerHTML"></div>
  <div hidden sse-swap="expired"></div>
</div></template>
<div class="table-wrap">
<table class="tbl results" data-num="2">
  <thead><tr><th>Partition</th><th>Offset</th><th>Timestamp (UTC)</th><th>Key</th><th>Value</th></tr></thead>
  <tbody id="tail-rows" data-max-rows="{maxRows}"></tbody>
</table>
</div>
{|<script>
  if (!window.tailTrim) {
    window.tailTrim = true;
    document.body.addEventListener('htmx:sseMessage', function () {
      var rows = document.getElementById('tail-rows');
      if (!rows) return;
      var max = parseInt(rows.dataset.maxRows, 10);
      while (rows.rows.length > max) rows.deleteRow(-1);
    });
  }
</script>|}
{/if}
