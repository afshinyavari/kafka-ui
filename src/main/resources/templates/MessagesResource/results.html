{#if error}
<div class="error" role="alert"><p>{error}</p></div>
{#else}
<div id="search-stream" class="search-status" sse-connect="/topics/{name}/messages/search?{form.query}" sse-close="done">
  <span sse-swap="progress">Searching…</span>
  {|<button type="button" class="btn" onclick="htmx.swap('#search-stream', document.getElementById('search-cancelled').innerHTML, {swapStyle: 'outerHTML'})">Cancel</button>|}
  <div hidden sse-swap="match" hx-target="#search-rows" hx-swap="beforeend"></div>
  <div hidden sse-swap="done" hx-target="#search-stream" hx-swap="outerHTML"></div>
  <div hidden sse-swap="expired"></div>
</div>
<template id="search-cancelled"><div id="search-stream" class="search-status">Stopped: cancelled</div></template>
<table class="results">
  <thead><tr><th>Partition</th><th>Offset</th><th>Timestamp (UTC)</th><th>Key</th><th>Value</th></tr></thead>
  <tbody id="search-rows"></tbody>
</table>
{/if}
