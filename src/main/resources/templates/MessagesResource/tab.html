{@java.lang.String name}
{@se.afshin.yavari.kafka.ui.messages.SearchForm form}
{@se.afshin.yavari.kafka.ui.topics.TopicInfo info}
<form class="search-form border-b border-line p-5" hx-get="/topics/{name}/messages/results" hx-target="#search-results" hx-swap="innerHTML">
  <div class="search-fields grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
    <label class="field lg:row-span-2">Partitions
      <select name="partition" multiple size="3" title="None selected means all partitions" class="input min-h-24 flex-1">
        {#for p in info.partitions}
        <option value="{p.partition}"{#if form.selected(p.partition)} selected{/if}>{p.partition}</option>
        {/for}
      </select>
    </label>
    <label class="field">From (UTC)
      <input type="datetime-local" step="1" name="from" value="{form.from}" class="input"{#if form.byOffset} disabled{/if}>
    </label>
    <label class="field">To (UTC, empty = now)
      <input type="datetime-local" step="1" name="to" value="{form.to}" class="input">
    </label>
    <label class="field">
      <span class="check text-xs font-medium"><input type="checkbox" name="byOffset" value="true"{#if form.byOffset} checked{/if}
        onchange="this.form.offset.disabled = !this.checked; this.form.from.disabled = this.checked"> Seek by offset</span>
      <input type="number" min="0" name="offset" placeholder="Start offset" value="{form.offset}" class="input"{#if !form.byOffset} disabled{/if}>
    </label>
    <label class="field">Key regex
      <input type="text" name="keyRegex" value="{form.keyRegex}" placeholder="e.g. ^order-" class="input font-mono">
    </label>
    <label class="field lg:col-span-2">Value regex
      <input type="text" name="valueRegex" value="{form.valueRegex}" placeholder="e.g. failed|error" class="input font-mono">
    </label>
  </div>
  <div class="toolbar mt-5">
    <button type="submit" class="btn btn-primary">{#include icons/search /}Search</button>
    <label class="check" title="Follow new messages as they arrive (uses partitions and regexes only)"><input type="checkbox" name="live" value="true"> Live (tail)</label>
    <span class="muted text-xs lg:ml-auto">No partition selected searches all partitions. Scans up to {limits.maxScanned} messages, shows up to {limits.maxMatches} matches.</span>
  </div>
</form>
<div id="search-results" class="[&>.alert]:m-5"></div>

      show('Checking session…');

        window.streamReopens = window.streamReopens.filter(function (t) { return now - t < 10000; });
